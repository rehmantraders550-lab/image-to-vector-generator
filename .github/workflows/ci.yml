name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile package
        run: python -m compileall -q src

      - name: CLI smoke test
        run: poster-vector --help

      - name: Run test suite
        run: pytest -q

  vector-smoke:
    name: SVG / press PDF acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install system renderers and validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape ghostscript qpdf poppler-utils tesseract-ocr curl xz-utils
          mkdir -p /tmp/pdfcpu-dist
          curl -fsSL -o /tmp/pdfcpu.tar.xz https://github.com/pdfcpu/pdfcpu/releases/download/v0.15.0/pdfcpu_0.15.0_Linux_x86_64.tar.xz
          tar -xJf /tmp/pdfcpu.tar.xz -C /tmp/pdfcpu-dist
          PDFCPU_BIN="$(find /tmp/pdfcpu-dist -type f -name pdfcpu | head -n 1)"
          test -n "$PDFCPU_BIN"
          sudo install -m 0755 "$PDFCPU_BIN" /usr/local/bin/pdfcpu
          pdfcpu version
          test -s /usr/share/color/icc/ghostscript/default_cmyk.icc

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "import pikepdf; print('pikepdf', pikepdf.__version__)"

      - name: Build editable SVG fixture
        run: |
          mkdir -p ci-output
          poster-vector build configs/gfc_background.yaml -o ci-output/background.svg
          test -s ci-output/background.svg
          if grep -Eiq '<(svg:)?image([ >])' ci-output/background.svg; then
            echo 'Unexpected embedded raster image found in SVG.' >&2
            exit 1
          fi

      - name: Render SVG with Inkscape
        run: |
          inkscape ci-output/background.svg --export-type=png --export-filename=ci-output/background.png
          test -s ci-output/background.png

      - name: Export vector PDF with Inkscape
        run: |
          inkscape ci-output/background.svg --export-type=pdf --export-filename=ci-output/background.pdf
          test -s ci-output/background.pdf

      - name: Validate PDF with Ghostscript
        run: gs -q -dNOPAUSE -dBATCH -sDEVICE=nullpage ci-output/background.pdf

      - name: Build arbitrary end-to-end reference fixture
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import numpy as np
          w,h=480,320
          x=np.linspace(0,1,w,dtype=np.float32)
          a=np.array([235,241,247],dtype=np.float32); b=np.array([168,197,229],dtype=np.float32)
          rgb=np.clip(a[None,None,:]*(1-x[None,:,None])+b[None,None,:]*x[None,:,None],0,255).astype(np.uint8)
          rgb=np.repeat(rgb,h,axis=0)
          im=Image.fromarray(rgb,'RGB'); d=ImageDraw.Draw(im)
          d.rounded_rectangle((35,45,180,125),radius=18,fill=(26,76,145))
          d.ellipse((300,45,390,135),fill=(210,52,62))
          d.polygon([(225,180),(300,205),(260,275),(190,245)],fill=(33,146,93))
          d.text((50,210),'VECTOR 2026',fill=(20,20,20))
          im.save('ci-output/reference.png')
          PY

      - name: Run complete delivery pipeline
        run: |
          poster-vector deliver ci-output/reference.png -o ci-output/job --trim-width-mm 101.6 --bleed-mm 3 --target-ppi 300
          test -s ci-output/job/delivery/artwork_master.svg
          test -s ci-output/job/delivery/artwork_editable.pdf
          test -s ci-output/job/delivery/artwork_press.pdf
          test -s ci-output/job/delivery/artwork_proof.png
          test -s ci-output/job/delivery/preflight_report.json
          test -s ci-output/job/delivery/production_manifest.json
          test -s ci-output/job/delivery/reconstruction_report.json

      - name: Validate final master and press PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json
          svg=Path('ci-output/job/delivery/artwork_master.svg')
          root=ET.parse(svg).getroot()
          local=lambda t:t.rsplit('}',1)[-1]
          layers={e.get('id') for e in root if local(e.tag)=='g'}
          required={'00_BACKGROUND','10_HERO','20_BRAND','30_DECORATION','40_ICONS','90_PREPRESS'}
          assert required.issubset(layers), layers
          assert not any(local(e.tag) in {'foreignObject','flowRoot','flowPara','script'} for e in root.iter())
          report=json.loads(Path('ci-output/job/delivery/reconstruction_report.json').read_text())
          assert report['outputs']['master_svg'].endswith('artwork_master.svg')
          assert report['truth_policy']['photography_never_claimed_as_vector'] is True
          preflight=json.loads(Path('ci-output/job/delivery/preflight_report.json').read_text())
          manifest=json.loads(Path('ci-output/job/delivery/production_manifest.json').read_text())
          assert manifest['locked_baseline']['default_bleed_mm'] == 3.0
          assert manifest['locked_baseline']['default_target_ppi'] == 300.0
          assert manifest['locked_baseline']['editable_master'] == 'SVG'
          assert manifest['locked_baseline']['process_color_default'] == 'CMYK'
          assert manifest['locked_baseline']['pdf_policy'] == 'PDF/X-4-oriented'
          assert manifest['production_semantics']['has_spot_colors'] is False
          assert preflight['passed'] is True, preflight
          assert preflight['press_ready'] is True, preflight
          assert preflight['svg']['passed'] is True
          assert preflight['pdf']['passed'] is True, preflight['pdf']
          checks=preflight['pdf']['checks']
          for name in ('pdf_version_at_least_1_6','media_bleed_trim_art_boxes_present','bleed_at_least_requested','output_intent_present','pdfx4_declared','device_rgb_absent','device_cmyk_present','raster_images_min_300_ppi','fonts_embedded'):
              assert checks[name] is True, (name, checks)
          assert preflight['geometry']['production_dimensions_confirmed'] is True
          assert preflight['geometry']['bleed_mm'] >= 3.0
          assert preflight['tools']['ghostscript'] is True
          assert preflight['tools']['qpdf'] is True
          assert preflight['tools']['pdfcpu'] is True
          assert preflight['tools']['pdfimages'] is True
          assert preflight['tools']['pdffonts'] is True
          assert preflight['tools']['pikepdf'] is True
          assert preflight['tool_checks']['ghostscript'] is True
          assert preflight['tool_checks']['qpdf'] is True
          assert preflight['tool_checks']['pdfcpu'] is True
          PY
          gs -q -dNOPAUSE -dBATCH -sDEVICE=nullpage ci-output/job/delivery/artwork_press.pdf
          qpdf --check ci-output/job/delivery/artwork_press.pdf
          pdfcpu validate ci-output/job/delivery/artwork_press.pdf
          pdfcpu validate -m strict ci-output/job/delivery/artwork_press.pdf || true
          pdfinfo -box ci-output/job/delivery/artwork_press.pdf
          pdfimages -list ci-output/job/delivery/artwork_press.pdf
          pdffonts ci-output/job/delivery/artwork_press.pdf
